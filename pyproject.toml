[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["data", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates dependency markers declared as parameter defaults.
"app/api/main.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
